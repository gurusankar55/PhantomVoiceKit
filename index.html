<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="home.pageTitle">Phantom Voice Kit</title>
  <!-- Shared Halloween theme (absolute path, per project rules) -->
  <link rel="stylesheet" href="/skeleton/theme.css" />
  <style>
    /* Small page-specific styles for the home screen only. */
    .home-header { text-align: center; margin-bottom: var(--space-4); }
    .home-ghost { font-size: 4rem; color: var(--color-ghost); }
    .home-subtitle { color: var(--color-ghost-dim); }
    .home-section { margin-bottom: var(--space-4); }
    .home-choices { display: flex; flex-direction: column; gap: var(--space-3); }
    .home-choices .btn { flex-direction: column; }
    .home-choice-hint { font-size: 0.95rem; font-weight: 400; }
    .home-tip {
      padding: var(--space-3);
      font-size: 0.95rem;
      color: var(--color-ghost-dim);
      background-color: var(--color-surface);
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <!-- Navigation header (menu, language dropdown) is filled in by nav-menu.js -->
  <header id="app-header"></header>

  <div class="home-header">
    <!-- Ghost mascot (decorative, so hidden from screen readers) -->
    <div class="home-ghost"><span class="icon-ghost" aria-hidden="true"></span></div>
    <h1 data-i18n="home.title">Phantom Voice Kit</h1>
    <p class="home-subtitle" data-i18n="home.subtitle">Speak your language. The ghosts will listen.</p>
  </div>

  <main>
    <!-- Navigation to the two apps. Links styled as large buttons. -->
    <nav class="home-section home-choices" data-i18n-attr="aria-label:home.chooseApp" aria-label="Choose an app">
      <a class="btn btn--large" href="/apps/spirit-clerk/index.html">
        <span data-i18n="home.spiritClerk">Fill a form by speaking</span>
        <span class="brand-sub" lang="en" dir="ltr">Spirit Clerk · Voice Form Filler</span>
      </a>
      <a class="btn btn--large" href="/apps/ghost-tutor/index.html">
        <span data-i18n="home.ghostTutor">Learn by speaking</span>
        <span class="brand-sub" lang="en" dir="ltr">Ghost Tutor · Voice Teacher</span>
      </a>
    </nav>

    <p class="home-tip" data-i18n="home.edgeTip">For the best voices in Indian languages, open this app in Microsoft Edge.</p>
  </main>

  <script type="module">
    import { createNavMenu } from '/skeleton/nav-menu.js';
    import { createLanguageDropdown } from '/skeleton/language-dropdown.js';
    import { initI18n } from '/skeleton/i18n.js';

    // Load the saved language first so the menu is built in that language.
    await initI18n();

    // Build the header (no Back button on the home screen).
    const nav = createNavMenu(document.getElementById('app-header'), {
      current: 'home',
      showBack: false,
    });

    // Renders the dropdown (English by default) on the right of the header
    // and saves the choice to sessionStorage.
    createLanguageDropdown(nav.languageEl);
  </script>
</body>
</html>
