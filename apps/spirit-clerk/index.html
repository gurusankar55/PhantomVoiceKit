<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="spiritClerk.pageTitle">Spirit Clerk</title>
  <!-- Shared theme and app styles (absolute paths, per project rules) -->
  <link rel="stylesheet" href="/skeleton/theme.css" />
  <link rel="stylesheet" href="/apps/spirit-clerk/style.css" />
</head>
<body>
  <!-- Shared navigation header (menu, Back, language) is built by app.js -->
  <header id="app-header"></header>

  <main id="app">
    <h1 class="app-title" data-i18n="spiritClerk.title">Spirit Clerk</h1>

    <!-- Screen 1: upload a form -->
    <section id="screen-upload" class="screen">
      <h2 data-i18n="spiritClerk.uploadHeading">Upload your form</h2>
      <label for="file-input" data-i18n="spiritClerk.fileLabel">Choose a PDF or a photo of your form</label>
      <!-- The real input is visually hidden; the label below acts as our own translated button.
           The input must come BEFORE the button so the focus style (sibling selector) works. -->
      <div class="file-picker">
        <input type="file" id="file-input" class="file-input-hidden" accept="application/pdf,image/jpeg,image/png,image/webp" />
        <label for="file-input" class="btn btn--secondary file-picker-button" data-i18n="spiritClerk.chooseFile">Choose file</label>
        <span id="file-name" class="file-name" data-i18n="spiritClerk.noFileChosen" aria-live="polite">No file chosen</span>
      </div>
      <button id="upload-confirm" type="button" class="btn" disabled data-i18n="spiritClerk.readForm">Read my form</button>
      <p id="upload-message" class="error-message" role="alert" hidden></p>
      <div id="upload-loading" hidden><span class="spinner"></span> <span data-i18n="spiritClerk.reading">Reading your form...</span></div>
    </section>

    <!-- Screen 2: answer each question -->
    <section id="screen-fill" class="screen" hidden>
      <p id="fill-progress"></p>
      <h2 id="fill-question"></h2>
      <p id="fill-audio-note" hidden></p>

      <button id="mic-button" type="button" class="btn" data-i18n="spiritClerk.speak">Speak</button>
      <p id="mic-message" hidden></p>

      <!-- Typed-answer fallback is rendered here by app.js -->
      <div id="text-fallback-container"></div>

      <!-- Shows the answer in the user's language and in English -->
      <div id="dual-display-container" hidden></div>

      <div id="confirm-controls" hidden>
        <button id="confirm-button" type="button" class="btn" data-i18n="spiritClerk.confirm">Confirm</button>
        <button id="redo-button" type="button" class="btn btn--secondary" data-i18n="spiritClerk.redo">Redo</button>
      </div>

      <p id="fill-message" role="alert" hidden></p>
      <div id="fill-loading" hidden><span class="spinner"></span> <span data-i18n="spiritClerk.pleaseWait">Please wait...</span></div>
    </section>

    <!-- Screen 3: summary and PDF download -->
    <section id="screen-summary" class="screen" hidden>
      <h2 data-i18n="spiritClerk.summaryHeading">Your filled form</h2>
      <div id="summary-loading" hidden><span class="spinner"></span> <span data-i18n="spiritClerk.preparing">Preparing your summary...</span></div>
      <ul id="summary-list"></ul>
      <p id="summary-skipped" hidden></p>
      <button id="download-pdf" type="button" class="btn" data-i18n="spiritClerk.downloadPdf">Download PDF</button>
      <p id="summary-message" class="error-message" role="alert" hidden></p>
    </section>

  </main>

  <!-- jsPDF must load BEFORE app.js so window.jspdf exists -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module" src="/apps/spirit-clerk/app.js"></script>
</body>
</html>
