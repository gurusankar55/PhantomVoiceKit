<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="pictureBook.pageTitle">Picture book – Phantom Voice Kit</title>
  <!-- Shared theme and app styles (absolute paths, per project rules) -->
  <link rel="stylesheet" href="/skeleton/theme.css" />
  <link rel="stylesheet" href="/apps/picture-book/style.css" />
</head>
<body>
  <!-- Shared navigation header (menu, Back, coins, sound, language) is built by skeleton/nav-menu.js -->
  <header id="app-header"></header>

  <main id="app" class="book">
    <h1 class="app-title"><span data-i18n="pictureBook.title">Talking picture book</span><span class="brand-sub" lang="en" dir="ltr">Picture Book · Talking Words</span></h1>
    <p class="book-intro" data-i18n="pictureBook.intro">Look at the picture and listen. Then say the word, or tap “I said it”.</p>

    <!-- The pages: one button per group of words (built by app.js) -->
    <div id="pages" class="book-pages" role="group" data-i18n-attr="aria-label:pictureBook.pages" aria-label="Pages"></div>

    <!-- One big picture -->
    <section id="card" class="book-card" aria-live="polite">
      <p id="position" class="book-position"></p>
      <span id="emoji" class="book-emoji" aria-hidden="true"></span>
      <p id="word" class="book-word"></p>
      <p id="second-word" class="book-second" hidden></p>
    </section>

    <div class="book-actions">
      <button id="hear-button" type="button" class="btn btn--large book-hear"><span aria-hidden="true">🔊</span> <span data-i18n="pictureBook.hear">Hear again</span></button>
      <button id="speak-button" type="button" class="btn btn--large book-speak"><span aria-hidden="true">🎤</span> <span data-i18n="pictureBook.speak">Say it</span></button>
      <button id="said-button" type="button" class="btn btn--large book-said"><span aria-hidden="true">✓</span> <span data-i18n="pictureBook.saidIt">I said it</span></button>
    </div>
    <p id="listening-indicator" class="listening-indicator" role="status" hidden>
      <span class="listening-dot" aria-hidden="true"></span>
      <span data-i18n="pictureBook.listening">Listening…</span>
    </p>
    <p id="message" class="book-message" role="status" hidden></p>

    <div class="book-nav">
      <button id="previous-button" type="button" class="btn btn--secondary book-step"><span class="book-arrow" aria-hidden="true">←</span> <span data-i18n="pictureBook.previous">Back</span></button>
      <button id="next-button" type="button" class="btn btn--secondary book-step"><span data-i18n="pictureBook.next">Next</span> <span class="book-arrow" aria-hidden="true">→</span></button>
    </div>

    <p id="learned" class="book-learned"></p>

    <!-- Learn another language: the word in a second language too -->
    <section class="book-second-lang">
      <label class="book-switch">
        <input id="second-toggle" type="checkbox" />
        <span data-i18n="pictureBook.secondLang">Learn another language</span>
      </label>
      <label for="second-select" class="book-label" data-i18n="pictureBook.secondLangLabel">Second language</label>
      <select id="second-select" class="book-select" disabled></select>
    </section>
  </main>

  <script type="module" src="/apps/picture-book/app.js"></script>
</body>
</html>
