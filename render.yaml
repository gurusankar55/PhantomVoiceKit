# Render Blueprint: one free web service.
# Secrets are NEVER written here: GEMINI_API_KEY and GEMINI_MODELS are marked "sync: false",
# so Render asks for their values in the dashboard when the Blueprint is created.
services:
  - type: web
    name: phantom-voice-kit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELS
        sync: false
