<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2a1648" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title data-i18n="pwa.offlineTitle">You are offline – Phantom Voice Kit</title>
  <link rel="stylesheet" href="/skeleton/theme.css" />
  <style>
    .offline { max-width: 32rem; margin: 3rem auto; display: flex; flex-direction: column; gap: var(--space-3); text-align: center; }
    .offline img { width: 6rem; height: 6rem; margin: 0 auto; border-radius: 24px; }
    .offline p { margin: 0; font-size: 1.15rem; }
  </style>
</head>
<body>
  <!-- Shown by the service worker for a page that needs the internet and was never opened before. -->
  <main class="offline">
    <img src="/skeleton/pwa/icons/icon-192.png" alt="" width="96" height="96" />
    <h1 data-i18n="pwa.offlineHeading">You are offline</h1>
    <p data-i18n="pwa.offlineText">This app needs the internet. Connect to the internet and try again. The games, stories, notes and Calm time work without internet.</p>
    <a class="btn btn--large" href="/" data-i18n="pwa.backHome">Go to Home</a>
  </main>
  <script type="module">
    import { initI18n } from '/skeleton/i18n.js';
    await initI18n(); // the translations are kept offline too
  </script>
</body>
</html>
